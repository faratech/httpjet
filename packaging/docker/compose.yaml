services:
  httpjet:
    image: ghcr.io/faratech/httpjet:latest
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp-httpjet.json
    ports:
      - "8080:8080/tcp"
      - "8443:8443/tcp"
    tmpfs:
      - /run/httpjet:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001,mode=0750
    volumes:
      - httpjet-state:/var/lib/httpjet
      - httpjet-logs:/var/log/httpjet
      # To use your own static content, uncomment and create ./public first:
      # - ./public:/var/www/httpjet:ro
    restart: unless-stopped

volumes:
  httpjet-state:
  httpjet-logs:
