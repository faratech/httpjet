name: Check empty package Pages origin
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  origin:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify bootstrap bytes, real 404s and public write refusal
        run: python3 -B packaging/release/pages.py probe-bootstrap --receipt origin-check.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-origin-bootstrap-check
          path: origin-check.json
          if-no-files-found: error
