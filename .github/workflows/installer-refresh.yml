name: Refresh approved package metadata
on:
  schedule:
    - cron: '13 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: httpjet-apt-stable
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    environment: httpjet-stable
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg python3 binutils rpm createrepo-c
      - name: Install the Pages CLI runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Refresh exactly the current signed and qualified version
        env:
          ARCHIVE_KEY: ${{ vars.HTTPJET_ARCHIVE_PUBLIC_KEY }}
          ARCHIVE_FINGERPRINT: ${{ vars.HTTPJET_ARCHIVE_FINGERPRINT }}
          ARCHIVE_PRIVATE_KEY: ${{ secrets.HTTPJET_ARCHIVE_PRIVATE_KEY }}
        run: |
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d "$RUNNER_TEMP/httpjet-signing.XXXXXX")
          printf 'GNUPGHOME=%s\n' "$GNUPGHOME" >> "$GITHUB_ENV"
          printf '%s\n' "$ARCHIVE_KEY" > archive.asc
          printf '%s\n' "$ARCHIVE_PRIVATE_KEY" | gpg --batch --import
          python3 packaging/release/release.py fetch-current --universal --public-key archive.asc --fingerprint "$ARCHIVE_FINGERPRINT" --output approved
          python3 packaging/release/release.py stage --directory approved --previous approved --output snapshot --public-key archive.asc --fingerprint "$ARCHIVE_FINGERPRINT"
      - name: Project refreshed metadata with retained native packages and release routes
        env:
          ARCHIVE_FINGERPRINT: ${{ vars.HTTPJET_ARCHIVE_FINGERPRINT }}
        run: |
          python3 packaging/release/pages.py project --snapshot snapshot --output pages-site \
            --public-key archive.asc --fingerprint "$ARCHIVE_FINGERPRINT" \
            --previous approved --repository "$GITHUB_REPOSITORY"
      - name: Deploy and verify refreshed Pages metadata under the publisher lease
        env:
          ARCHIVE_FINGERPRINT: ${{ vars.HTTPJET_ARCHIVE_FINGERPRINT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
          HTTPJET_S3_ENDPOINT: ${{ vars.HTTPJET_S3_ENDPOINT }}
          HTTPJET_S3_BUCKET: ${{ vars.HTTPJET_S3_BUCKET }}
          HTTPJET_S3_REGION: ${{ vars.HTTPJET_S3_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.HTTPJET_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HTTPJET_S3_SECRET_ACCESS_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          python3 packaging/release/pages.py deploy --snapshot snapshot --directory pages-site \
            --public-key archive.asc --fingerprint "$ARCHIVE_FINGERPRINT" --receipt pages-deployment.json
      - name: Retain the verified Pages refresh receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-pages-refresh
          path: pages-deployment.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove ephemeral signing material
        if: always()
        run: |
          gpgconf --kill all || true
          if [ -n "${GNUPGHOME:-}" ]; then rm -rf "$GNUPGHOME"; fi
