name: Installer release build and signing
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: httpjet-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the public release tag on main
        run: |
          test "$GITHUB_REPOSITORY" = faratech/httpjet
          test "$GITHUB_REF_TYPE" = tag
          git check-ref-format "$GITHUB_REF"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "$GITHUB_REF^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          python3 - <<'PY'
          import os, pathlib, re, sys
          sys.path.insert(0, 'packaging/release')
          import support
          line = pathlib.Path('debian/changelog').read_text().splitlines()[0]
          version = re.search(r'\(([^)]+)\)', line)[1]
          if os.environ['GITHUB_REF'] != 'refs/tags/' + support.identity(version)['tag']:
              raise SystemExit('release tag must match the canonical package revision')
          PY
  images:
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve exact authenticated image inputs
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml gnupg libarchive-tools squashfs-tools e2fsprogs
          python3 packaging/release/resolve-images.py --output image-inputs --cache "$RUNNER_TEMP/httpjet-images"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualification-images
          path: image-inputs/qualification-images.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualification-rootfs-devuan-stable-amd64
          path: image-inputs/qualification-rootfs-devuan-stable-amd64.tar.gz
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualification-rootfs-slackware-15.0-amd64
          path: image-inputs/qualification-rootfs-slackware-15.0-amd64.tar.gz
          if-no-files-found: error
          retention-days: 30
  native:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Source-build portable release packages
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          ARCHIVE_KEY: ${{ vars.HTTPJET_ARCHIVE_PUBLIC_KEY }}
          ARCHIVE_FINGERPRINT: ${{ vars.HTTPJET_ARCHIVE_FINGERPRINT }}
        run: |
          test -n "$ARCHIVE_KEY"
          printf '%s\n' "$ARCHIVE_KEY" > "$RUNNER_TEMP/archive.asc"
          docker run --rm \
            --security-opt "seccomp=$GITHUB_WORKSPACE/packaging/oci/seccomp-httpjet.json" \
            --ulimit memlock=8388608:8388608 \
            --volume "$GITHUB_WORKSPACE:/work" --volume "$RUNNER_TEMP/archive.asc:/tmp/archive.asc:ro" \
            --workdir /work --env RELEASE_TAG --env ARCHIVE_FINGERPRINT --env CARGO_BUILD_JOBS=2 \
            rust:1.99.1-bookworm@sha256:48b7f435b8fc6378ce43b44f15e3a47fd8919b2825f835c39bd4bd3da50af5b8 \
            bash -c 'apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl python3 build-essential musl-tools rpm cmake pkg-config clang debhelper gnupg ripgrep xz-utils && git config --global --add safe.directory /work && bash packaging/release/build.sh "$RELEASE_TAG" /work/dist /tmp/archive.asc "$ARCHIVE_FINGERPRINT"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.architecture }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
  oci:
    needs: [native, images]
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-${{ matrix.architecture }}
          path: native
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qualification-images
          path: images
      - name: Build the exact static payload into its immutable OCI carrier
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          base=$(python3 -c 'import json,os; print(json.load(open("images/qualification-images.json"))["oci_bases"][os.environ["ARCHITECTURE"]]["image"])')
          python3 packaging/release/build-oci.py native "$ARCHITECTURE" --base "$base"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: carriers-${{ matrix.architecture }}
          path: native/
          if-no-files-found: error
          retention-days: 30
  candidate:
    needs: [oci, images]
    runs-on: ubuntu-24.04
    environment: httpjet-candidate-signing
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: carriers-*
          merge-multiple: true
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qualification-images
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: qualification-rootfs-*
          merge-multiple: true
          path: candidate
      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg python3 binutils rpm createrepo-c libarchive-tools
      - name: Validate identities and sign a local candidate snapshot
        env:
          ARCHIVE_KEY: ${{ vars.HTTPJET_ARCHIVE_PUBLIC_KEY }}
          ARCHIVE_FINGERPRINT: ${{ vars.HTTPJET_ARCHIVE_FINGERPRINT }}
          ARCHIVE_PRIVATE_KEY: ${{ secrets.HTTPJET_ARCHIVE_PRIVATE_KEY }}
        run: |
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d "$RUNNER_TEMP/httpjet-signing.XXXXXX")
          printf 'GNUPGHOME=%s\n' "$GNUPGHOME" >> "$GITHUB_ENV"
          printf '%s\n' "$ARCHIVE_KEY" > archive.asc
          printf '%s\n' "$ARCHIVE_PRIVATE_KEY" | gpg --batch --import
          python3 packaging/release/release.py sign-carriers candidate --public-key archive.asc --fingerprint "$ARCHIVE_FINGERPRINT"
          python3 packaging/release/release.py manifest candidate
          python3 - <<'PY'
          import os,pathlib,sys,shutil,urllib.error
          sys.path.insert(0,'packaging/release')
          import release
          previous=pathlib.Path('previous')
          try:
              release.fetch_current(release.REPO_URL,previous,pathlib.Path('archive.asc'),
                                    os.environ['ARCHIVE_FINGERPRINT'],True,allow_unqualified=True)
          except urllib.error.HTTPError as error:
              if error.code != 404 or error.url != release.REPO_URL.removesuffix('/apt')+'/releases/stable.json':
                  raise
              error.close()
              shutil.rmtree(previous)
          release.stage(pathlib.Path('candidate'),pathlib.Path('snapshot'),pathlib.Path('archive.asc'),
                        os.environ['ARCHIVE_FINGERPRINT'],pathlib.Path('packaging/installer/install.sh.in'),
                        candidate=True,previous=previous if previous.exists() else None)
          PY
      - name: Retain the successfully signed release candidate
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-candidate
          path: |
            candidate/
            !candidate/qualification-rootfs-*.tar.gz
            snapshot/
            previous/
            archive.asc
          if-no-files-found: error
          retention-days: 30
      - name: Remove ephemeral signing material
        if: always()
        run: |
          gpgconf --kill all || true
          rm -rf "$GNUPGHOME"
