name: Publish signed installer and packages
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Run that built and signed the candidate
        required: true
        type: string
      recover_failed_run_id:
        description: Explicitly release the matching lease of this completed failed publication
        required: false
        type: string
  workflow_run:
    workflows: ['Installer release build and signing']
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: httpjet-apt-stable
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment: httpjet-stable
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-candidate
          path: candidate-input
          run-id: ${{ inputs.candidate_run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Confirm the candidate source and signing job
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id || github.event.workflow_run.id }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          run_id = os.environ['CANDIDATE_RUN']
          repository = os.environ['GITHUB_REPOSITORY']
          if repository != 'faratech/httpjet' or not re.fullmatch(r'[0-9]+', run_id):
              raise SystemExit('unexpected repository or candidate run')
          manifest = json.loads(pathlib.Path('candidate-input/candidate/manifest.json').read_text())
          run = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repository}/actions/runs/{run_id}']))
          jobs = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repository}/actions/runs/{run_id}/jobs?per_page=100']))['jobs']
          if (run['status'] != 'completed' or run['path'] != '.github/workflows/installer-release.yml'
              or run['head_sha'] != manifest['commit'] or run['head_branch'] != manifest['tag']
              or run['head_repository']['full_name'] != repository):
              raise SystemExit('candidate does not match the public release tag')
          required = ('candidate', 'native (amd64, ubuntu-24.04)', 'native (arm64, ubuntu-24.04-arm)')
          if any(not any(j['name'] == name and j['conclusion'] == 'success' for j in jobs) for name in required):
              raise SystemExit('candidate signing or native build job did not succeed')
          tag = manifest['tag']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9]+)?', tag):
              raise SystemExit('invalid release tag')
          target = subprocess.check_output(['git', 'rev-parse', tag + '^{commit}'], text=True).strip()
          if target != manifest['commit']:
              raise SystemExit('release tag changed')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('HTTPJET_RELEASE_TAG=' + tag + '\n')
          PY
      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg python3 binutils rpm createrepo-c
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Assemble the signed build-only release
        env:
          ARCHIVE_KEY: ${{ vars.HTTPJET_ARCHIVE_PUBLIC_KEY }}
          ARCHIVE_FINGERPRINT: ${{ vars.HTTPJET_ARCHIVE_FINGERPRINT }}
          ARCHIVE_PRIVATE_KEY: ${{ secrets.HTTPJET_ARCHIVE_PRIVATE_KEY }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id || github.event.workflow_run.id }}
        run: |
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d "$RUNNER_TEMP/httpjet-signing.XXXXXX")
          printf 'GNUPGHOME=%s\n' "$GNUPGHOME" >> "$GITHUB_ENV"
          printf '%s\n' "$ARCHIVE_KEY" > archive.asc
          printf '%s\n' "$ARCHIVE_PRIVATE_KEY" | gpg --batch --import
          python3 packaging/release/publish_build_only.py --candidate candidate-input \
            --assets public-assets --pages pages-site --public-key archive.asc \
            --fingerprint "$ARCHIVE_FINGERPRINT" --run-id "$CANDIDATE_RUN"
      - name: Attest the published artifact bytes
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: public-assets/*
      - name: Publish GitHub assets
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id || github.event.workflow_run.id }}
        run: |
          printf 'Signed Linux builds from GitHub Actions run https://github.com/%s/actions/runs/%s.\n\nThe full distribution matrix was not completed for this release. io_uring is required.\n' "$GITHUB_REPOSITORY" "$CANDIDATE_RUN" > release-notes.txt
          cat >> release-notes.txt <<'NOTES'

          Downloads:
          - .deb packages: Debian and Ubuntu.
          - .rpm packages: Fedora, RHEL and compatible distributions.
          - .tar.gz archives: other compatible Linux distributions.
          - amd64/x86_64 is for Intel/AMD 64-bit systems; arm64/aarch64 is for 64-bit ARM.
          - install.sh selects the installation route. Use the signed APT/RPM repositories for package-managed updates.

          Installation instructions: https://github.com/faratech/httpjet/blob/main/packaging/installer/README.md
          NOTES
          if python3 -c 'import json,sys; sys.exit(0 if json.load(open("candidate-input/snapshot/publication.json")).get("amend") is True else 1)'; then
            cat >> release-notes.txt <<'AMENDMENT'

          This release was amended to enable HTTPS on port 443 for fresh installations, using a unique self-signed certificate. Browsers show a certificate warning until a trusted certificate is configured. Existing listener settings and administrator certificates are preserved.

          Already installed this package version? Use `sudo apt-get update && sudo apt-get install --reinstall httpjet` or `sudo dnf --refresh reinstall httpjet` to receive the amended package. HTTPS remains an explicit administrator choice for existing HTTP-only installations.
          AMENDMENT
          fi
          if gh release view "$HTTPJET_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$HTTPJET_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets > existing-release.json
            python3 - <<'PY'
          import hashlib, json, pathlib
          amend=json.loads(pathlib.Path('candidate-input/snapshot/publication.json').read_text()).get('amend') is True
          assets = {a['name']: a for a in json.loads(pathlib.Path('existing-release.json').read_text())['assets']}
          missing = []
          for path in pathlib.Path('public-assets').iterdir():
              actual = assets.get(path.name)
              if actual is None:
                  missing.append(str(path)); continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual.get('size') != path.stat().st_size or actual.get('digest') != 'sha256:' + digest:
                  if not amend:raise SystemExit('existing release asset differs: ' + path.name)
                  missing.append(str(path))
          pathlib.Path('missing-assets.txt').write_text(''.join(path+'\n' for path in missing))
          PY
            amendment=$(python3 -c 'import json; print("true" if json.load(open("candidate-input/snapshot/publication.json")).get("amend") is True else "false")')
            while IFS= read -r path; do
              if [ "$amendment" = true ]; then
                gh release upload "$HTTPJET_RELEASE_TAG" "$path" --repo "$GITHUB_REPOSITORY" --clobber
              else
                gh release upload "$HTTPJET_RELEASE_TAG" "$path" --repo "$GITHUB_REPOSITORY"
              fi
            done < missing-assets.txt
            gh release edit "$HTTPJET_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.txt
          else
            gh release create "$HTTPJET_RELEASE_TAG" public-assets/* --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --title "HTTPJet $HTTPJET_RELEASE_TAG" --notes-file release-notes.txt
            gh release edit "$HTTPJET_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          fi
      - name: Publish Pages and promote the release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ARCHIVE_FINGERPRINT: ${{ vars.HTTPJET_ARCHIVE_FINGERPRINT }}
          HTTPJET_S3_ENDPOINT: ${{ vars.HTTPJET_S3_ENDPOINT }}
          HTTPJET_S3_BUCKET: ${{ vars.HTTPJET_S3_BUCKET }}
          HTTPJET_S3_REGION: ${{ vars.HTTPJET_S3_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.HTTPJET_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HTTPJET_S3_SECRET_ACCESS_KEY }}
          GH_TOKEN: ${{ github.token }}
          WRANGLER_SEND_METRICS: 'false'
          RECOVER_FAILED_RUN: ${{ inputs.recover_failed_run_id }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, sys, time, urllib.error, urllib.request
          sys.path.insert(0, 'packaging/release')
          import pages, release
          from publish import S3
          from publish_v2 import LOCK_KEY, publication_lock
          publication = release.load('candidate-input/snapshot/publication.json')
          store = S3()
          recovery = os.environ.get('RECOVER_FAILED_RUN', '')
          if recovery:
              if not re.fullmatch(r'[0-9]+', recovery):raise ValueError('invalid recovery run')
              run = json.loads(subprocess.check_output(['gh', 'api', 'repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+recovery]))
              if run['status'] != 'completed' or run['conclusion'] != 'failure' or run['path'] != '.github/workflows/installer-publish-now.yml':
                  raise ValueError('recovery requires a completed failed publisher')
              with store.request('GET', LOCK_KEY) as response:
                  lock = json.loads(response.read()); etag = response.headers.get('ETag')
              if (not etag or lock.get('schema') != 1 or lock.get('state') != 'held'
                  or str(lock.get('run_id')) != recovery or str(lock.get('run_attempt')) != str(run['run_attempt'])
                  or lock.get('stable_sha256') != publication['stable_sha256']):
                  raise ValueError('failed publisher does not own this exact publication lease')
              pages.precondition(publication, pathlib.Path('archive.asc'), os.environ['ARCHIVE_FINGERPRINT'])
              lock.update(state='released', recovered_by_run=os.environ['GITHUB_RUN_ID'])
              body = (json.dumps(lock, sort_keys=True, separators=(',', ':'))+'\n').encode()
              with store.request('PUT', LOCK_KEY, body, {'if-match': etag, 'content-type': 'application/json',
                                  'cache-control': 'no-store', 'x-amz-meta-sha256': hashlib.sha256(body).hexdigest()}):pass
          with publication_lock(store, publication['stable_sha256']):
              pages.precondition(publication, pathlib.Path('archive.asc'), os.environ['ARCHIVE_FINGERPRINT'])
              subprocess.run(['npx', '--yes', 'wrangler@4.153.0', 'pages', 'deploy', 'pages-site',
                              '--project-name', 'httpjet-packages', '--branch', 'main', '--commit-dirty=true'], check=True)
              release_id = publication['release_id']
              for name in ('manifest.json', 'manifest.json.asc', 'publication-status.json', 'RELEASE-NOTES.txt'):
                  url = pages.ORIGIN + '/releases/' + release_id + '/' + name
                  expected = release.sha(pathlib.Path('pages-site/releases') / release_id / name)
                  for attempt in range(20):
                      request = urllib.request.Request(url, headers={'User-Agent': release.USER_AGENT, 'Cache-Control': 'no-cache'})
                      try:
                          with urllib.request.urlopen(request, timeout=10) as response:
                              if response.url == url and hashlib.sha256(response.read()).hexdigest() == expected:break
                      except urllib.error.HTTPError as error:
                          if error.code not in (404, 408, 429, 500, 502, 503, 504):raise
                          error.close()
                      time.sleep(2)
                  else:raise ValueError('Pages metadata is not available at its permanent URL: ' + name)
              for name in ('manifest.json', 'manifest.json.asc', 'publication-status.json', 'RELEASE-NOTES.txt'):
                  subprocess.run(['gh', 'release', 'delete-asset', os.environ['HTTPJET_RELEASE_TAG'], name,
                                  '--repo', os.environ['GITHUB_REPOSITORY'], '--yes'], check=False)
              subprocess.run(['gh', 'release', 'edit', os.environ['HTTPJET_RELEASE_TAG'], '--repo',
                              os.environ['GITHUB_REPOSITORY'], '--latest'], check=True)
          PY
      - name: Record the published candidate for container builds
        env:
          CANDIDATE_RUN: ${{ inputs.candidate_run_id || github.event.workflow_run.id }}
        run: printf '%s\n' "$CANDIDATE_RUN" > published-candidate-run.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: published-candidate-run
          path: published-candidate-run.txt
          if-no-files-found: error
          retention-days: 30
      - name: Remove ephemeral signing material
        if: always()
        run: |
          gpgconf --kill all || true
          if [ -n "${GNUPGHOME:-}" ]; then rm -rf "$GNUPGHOME"; fi
