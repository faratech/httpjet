name: Check private publisher credentials and Pages bootstrap
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record public Pages HTTP observations without credentials
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess,tempfile,urllib.error,urllib.request
          urls=('https://httpjet-packages.pages.dev/','https://55efde7b.httpjet-packages.pages.dev/')
          allowed={'cf-ray','cf-mitigated','server','content-type','www-authenticate','location'}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(NoRedirect(),urllib.request.ProxyHandler({}))
          records=[]
          for url in urls:
              for client,agent in (('python-urllib-default',None),('python-honest-release-ua','httpjet-release/0.1.10'),('python-apt-ua','Debian APT-HTTP/1.3 (2.8.3)')):
                  record={'url':url,'client':client,'user_agent':agent,'scope':'public-response-observation'}
                  try:
                      request=urllib.request.Request(url,headers={} if agent is None else {'User-Agent':agent})
                      try: response=opener.open(request,timeout=30)
                      except urllib.error.HTTPError as error: response=error
                      with response:
                          record.update(status=response.getcode(),headers={key.lower():value for key,value in response.headers.items() if key.lower() in allowed},body=response.read(4096).decode('utf-8','replace'))
                  except Exception as error: record['error_type']=type(error).__name__
                  records.append(record)
              record={'url':url,'client':'curl-default','scope':'public-response-observation'}
              try:
                  with tempfile.TemporaryDirectory(prefix='httpjet-pages-diagnostics-') as temporary:
                      root=pathlib.Path(temporary);headers=root/'headers';body=root/'body'
                      result=subprocess.run(['curl','--disable','--silent','--noproxy','*','--max-time','30','--max-filesize','1048576','--dump-header',str(headers),'--output',str(body),'--write-out','%{http_code}',url],capture_output=True,text=True,timeout=45,env={'PATH':os.environ['PATH']})
                      selected={}
                      if headers.exists():
                          for line in headers.read_text(errors='replace').splitlines():
                              key,separator,value=line.partition(':')
                              if separator and key.lower() in allowed: selected[key.lower()]=value.strip()
                      content=''
                      if body.exists():
                          with body.open('rb') as stream: content=stream.read(4096).decode('utf-8','replace')
                      record.update(status=int(result.stdout) if result.stdout.isdigit() else None,curl_exit=result.returncode,headers=selected,body=content)
              except Exception as error: record['error_type']=type(error).__name__
              records.append(record)
          pathlib.Path('pages-diagnostics.json').write_text(json.dumps({'schema':1,'observations':records},indent=2)+'\n')
          print(json.dumps(records,indent=2))
          PY
      - name: Check the empty Pages origin read-only
        run: python3 -B packaging/release/pages.py probe-bootstrap --read-only --receipt pages-bootstrap-readonly.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: public-pages-diagnostics
          path: |
            pages-diagnostics.json
            pages-bootstrap-readonly.json
          if-no-files-found: warn

  private-storage:
    runs-on: ubuntu-24.04
    environment: httpjet-stable
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify private conditional PUT and delete the temporary object
        env:
          HTTPJET_S3_ENDPOINT: ${{ vars.HTTPJET_S3_ENDPOINT }}
          HTTPJET_S3_BUCKET: ${{ vars.HTTPJET_S3_BUCKET }}
          HTTPJET_S3_REGION: ${{ vars.HTTPJET_S3_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.HTTPJET_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HTTPJET_S3_SECRET_ACCESS_KEY }}
        run: python3 -B packaging/release/check-private-origin.py --receipt private-origin-check.json
      - name: Check Pages bootstrap with only GET and HEAD
        if: always()
        run: python3 -B packaging/release/check-private-origin.py --pages-only --receipt protected-pages-check.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: protected-private-origin-check
          path: |
            private-origin-check.json
            protected-pages-check.json
          if-no-files-found: warn
