name: Actions policy

on:
  push:
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    uses: faratech/ci-standards/.github/workflows/actions-policy.yml@main
    with:
      policy_strict: false
